<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ID handover frame</title>
</head>
<body>
<h1>ID handover frame</h1>
<p>Sends GA4 hits from the top frame and from a sandboxed iframe. <code>?frame=rotate-cid</code> or <code>?frame=rotate-sid</code> changes the ID the frame sends.</p>
<iframe id="child" sandbox="allow-scripts" title="Sandboxed frame"></iframe>
<script>
var CID = '3333333333.4444444444';
var SID = '1730000000';
var mode = new URLSearchParams(location.search).get('frame');
var frameCid = mode === 'rotate-cid' ? '5555555555.6666666666' : CID;
var frameSid = mode === 'rotate-sid' ? '1730009999' : SID;
new Image().src = 'https://www.google-analytics.com/g/collect?v=2&tid=G-PWTEST0001&cid=' + CID + '&sid=' + SID + '&en=page_view&dl=' + encodeURIComponent(location.href);
document.getElementById('child').src = '/id-handover-frame-child?cid=' + frameCid + '&sid=' + frameSid;
</script>
</body>
</html>
