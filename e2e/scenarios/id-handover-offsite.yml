start: /plain/product?checkout=offsite
steps:
  - consent: accept
  - visit: /plain/product?checkout=offsite
  - click: "#to-checkout"
  - consent: accept
  - fill:
      "#email": email
      "#first-name": firstName
      "#last-name": lastName
      "#phone": phone
      "#address1": address1
      "#city": city
      "#zip": zip
      "#country": SE
  - click: "#place-order"
  - wait: 3s
options: { seed: 1 }
