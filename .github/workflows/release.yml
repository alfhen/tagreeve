name: release

on:
  push:
    branches: [main]
    paths: [package.json]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Decide whether to release
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          line=$(node scripts/release-plan.ts "$BEFORE" "$SHA")
          echo "$line"
          if [[ "$line" =~ ^release\ ([0123456789.]+(-rc\.[0123456789]+)?)\ (next|latest)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "dist_tag=${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
          elif [[ "$line" != skip:* ]]; then
            echo "unexpected plan line" >&2
            exit 1
          fi

  tag:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      VERSION: ${{ needs.plan.outputs.version }}
    outputs:
      tag: ${{ steps.out.outputs.tag }}
      sha: ${{ steps.out.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the release commit and tag it
        run: scripts/release.sh --at ${{ github.sha }} "$VERSION"
      - name: Push the tag
        run: git push origin "refs/tags/v$VERSION"
      - name: Output the tag and its commit
        id: out
        run: |
          sha=$(git rev-parse "v$VERSION^{commit}")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  check:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/release-tag.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      sha: ${{ needs.tag.outputs.sha }}

  publish:
    needs: [plan, tag, check]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      DIST_TAG: ${{ needs.plan.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the pinned npm
        run: npm install -g npm@11.21.2
      - name: Check the npm version
        run: test "$(printf '%s\n11.21.0\n' "$(npm --version)" | sort -V | head -n1)" = 11.21.0
      - name: Skip the publish when the version is on npm
        id: guard
        run: |
          result=$(node scripts/release-plan.ts --guard "$VERSION" "$DIST_TAG")
          echo "$result"
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.guard.outputs.result == 'publish'
        run: npm publish --tag "$DIST_TAG"

  verify:
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the dist-tag
        run: |
          for i in $(seq 1 10); do
            node scripts/check-npm-dist-tag.ts "$VERSION" && exit 0
            if [ "$i" -lt 10 ]; then sleep 30; fi
          done
          exit 1
