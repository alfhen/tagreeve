# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# The plan gives about one review an hour. The land step of the pipeline asks for one review on the final head of a PR
# ("@coderabbitai full review"), so no review is spent on an earlier push.
reviews:
  auto_review:
    enabled: false
  review_status: false
